ServerTokens Prod
ServerSignature Off
<VirtualHost *:80>
    DocumentRoot /var/www/html/public
    <Directory /var/www/html/public>
        AllowOverride None
        Require all granted
        Options -Indexes
        FallbackResource /index.php
    </Directory>
    # Sin URI, query, referrer, cookies ni IP: los tokens no llegan al access log.
    LogFormat "%>s %b %D" safe_status
    CustomLog /proc/self/fd/1 safe_status
    ErrorLog /proc/self/fd/2
    LogLevel crit
</VirtualHost>
