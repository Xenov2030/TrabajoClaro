name: TrabajoClaro checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          PLAYWRIGHT_BUNDLED: '1'
      - run: bash scripts/test-database.sh
      - run: bash scripts/test-integration.sh
        env:
          PLAYWRIGHT_BUNDLED: '1'
