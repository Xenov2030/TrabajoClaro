# Ejemplo: adaptar dominio, ruta y upstream PHP-FPM al servidor real.
# HTTPS debe configurarse con un certificado válido antes de producción.
server {
    listen 80;
    server_name example.test;
    root /var/www/trabajoclaro/public;
    index index.php;

    location / { try_files $uri $uri/ /index.php?$query_string; }
    # No registrar tokens, ni siquiera en errores o redirecciones.
    location ^~ /p/ {
        access_log off;
        error_log /dev/null;
        try_files $uri /index.php?$query_string;
    }
    location = /index.php {
        # La redirección interna de /p/ termina acá: desactivar el log del
        # front controller evita que la URI original se registre al finalizar.
        access_log off;
        error_log /dev/null;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    }
    location ~ \.php$ { return 404; }
    location ~ /\.(?!well-known) { deny all; }
}
